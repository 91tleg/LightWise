AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Env:
    Type: String
    Default: local
  DynamoEndpoint:
    Type: String
    Default: ""
  InfluxUrl:
    Type: String
    Default: ""
  InfluxToken:
    Type: String
    Default: ""
    NoEcho: true
  InfluxOrg:
    Type: String
    Default: ""
  AuthEnabled:
    Type: String
    Default: "true"
  AllowedOrigin:
    Type: String
    Default: "'*'"
  FrontendUrl:
    Type: String
    Default: "http://localhost:3001"
  CognitoRedirectUri:
    Type: String
    Default: "http://localhost:3001/callback"
  CognitoLogoutUri:
    Type: String
    Default: "http://localhost:3001"

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,PUT,POST,DELETE,PATCH,OPTIONS'"
      AllowHeaders: "'Content-Type,Cookie'"
      AllowOrigin: !Ref AllowedOrigin
      AllowCredentials: true
    Auth:
      DefaultAuthorizer: CookieAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CookieAuthorizer:
          FunctionArn: !GetAtt CookieAuthorizerFunction.Arn
          FunctionPayloadType: REQUEST
          Identity:
            Headers:
              - Cookie
            ReauthorizeEvery: 300
  Function:
    Runtime: python3.11
    Timeout: 15
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        ENV:                             !Ref Env
        AUTH_ENABLED:                    !Ref AuthEnabled
        COGNITO_USER_POOL_ID:            !Ref CognitoUserPool
        COGNITO_CLIENT_ID:               !Ref CognitoAppClient
        COGNITO_DOMAIN:                  !Sub "${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
        COGNITO_REDIRECT_URI:            !Ref CognitoRedirectUri
        FRONTEND_URL:                    !Ref FrontendUrl
        WS_ENDPOINT:                     !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
        WS_MANAGEMENT_URL:               !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
        DYNAMO_ENDPOINT:                 !Ref DynamoEndpoint
        DDB_TABLE_STREETLIGHTS:          !Ref Streetlights
        DDB_TABLE_STREETLIGHT_METADATA:  !Ref StreetlightMetadata
        DDB_TABLE_USERS_AND_TENANTS:     !Ref UsersAndTenants
        DDB_TABLE_WS_CONNECTIONS:        !Ref WebSocketConnections
        DDB_TABLE_DOWNLINK_COMMANDS:     !Ref DownlinkCommands
        TELEMETRY_BACKEND:               influxdb
        INFLUX_URL:                      !Ref InfluxUrl
        INFLUX_TOKEN:                    !Ref InfluxToken
        INFLUX_ORG:                      !Ref InfluxOrg
        INFLUX_BUCKET:                   streetlight-telemetry

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "lightwise-${Env}"

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailMessage: |
            You have been invited to LightWise.
            Your username is {username} and your temporary password is {####}.
            Please sign in and change your password.
          EmailSubject: "Your LightWise account"

      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

        - Name: given_name
          AttributeDataType: String
          Required: true
          Mutable: true

        - Name: family_name
          AttributeDataType: String
          Required: true
          Mutable: true

        - Name: tenant_id
          AttributeDataType: String
          Required: false
          Mutable: false

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

      MfaConfiguration: "OFF"

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref CognitoUserPool
      Description: "Full access — LightWise team and system administrators"
      Precedence: 0

  CognitoOperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operator
      UserPoolId: !Ref CognitoUserPool
      Description: "Read and control access — municipal operators"
      Precedence: 1

  CognitoAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "lightwise-frontend-${Env}"
      UserPoolId: !Ref CognitoUserPool
      SupportedIdentityProviders:
        - COGNITO

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthScopes:
        - email
        - openid
        - phone
        - profile

      CallbackURLs:
        - !Ref CognitoRedirectUri
      LogoutURLs:
        - !Ref CognitoLogoutUri
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

      ReadAttributes:
        - email
        - given_name
        - family_name
        - custom:tenant_id

      WriteAttributes:
        - email
        - given_name
        - family_name

      PreventUserExistenceErrors: ENABLED

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "lightwise-${Env}-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPool

  CookieAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.cookie_authorizer.handler

  CookieAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CookieAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessRestApi}/*"

  AuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.auth_callback.handler
      Events:
        AuthCallback:
          Type: Api
          Properties:
            Path: /auth/callback
            Method: get
            Auth:
              Authorizer: NONE

  AuthRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.auth_refresh.handler
      Events:
        AuthRefresh:
          Type: Api
          Properties:
            Path: /auth/refresh
            Method: post
            Auth:
              Authorizer: NONE

  AuthMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.auth.handler
      Events:
        AuthMe:
          Type: Api
          Properties:
            Path: /auth/me
            Method: get

  ListUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.user_list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersAndTenants
      Events:
        ListUsers:
          Type: Api
          Properties:
            Path: /users
            Method: get

  InviteUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.user_invite.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersAndTenants
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        InviteUser:
          Type: Api
          Properties:
            Path: /invite-user
            Method: post

  RemoveUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.user_remove.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersAndTenants
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        RemoveUser:
          Type: Api
          Properties:
            Path: /users/{id}
            Method: delete

  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.user_update.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersAndTenants
      Events:
        UpdateUser:
          Type: Api
          Properties:
            Path: /users/{id}
            Method: patch

  ListStreetlightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.streetlights_list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Streetlights
        - DynamoDBReadPolicy:
            TableName: !Ref StreetlightMetadata
      Events:
        ListStreetlights:
          Type: Api
          Properties:
            Path: /streetlights
            Method: get

  GetStreetlightFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.streetlights_get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Streetlights
        - DynamoDBReadPolicy:
            TableName: !Ref StreetlightMetadata
      Events:
        GetStreetlight:
          Type: Api
          Properties:
            Path: /streetlights/{id}
            Method: get

  GetStreetlightTelemetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.streetlights_telemetry.handler
      Events:
        GetStreetlightTelemetry:
          Type: Api
          Properties:
            Path: /streetlights/{id}/telemetry
            Method: get

  UpdateStreetlightMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.streetlights_update_metadata.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreetlightMetadata
      Events:
        UpdateStreetlightMetadata:
          Type: Api
          Properties:
            Path: /streetlights/{id}/metadata
            Method: put

  StreetlightsSendCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.streetlights_send_command.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DownlinkCommands
        - Statement:
            - Effect: Allow
              Action:
                - iotwireless:SendDataToWirelessDevice
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: "*"
      Events:
        SendCommand:
          Type: Api
          Properties:
            Path: /streetlights/{id}/commands
            Method: post

  StreetlightsListCommandsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.streetlights_list_commands.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DownlinkCommands
      Events:
        ListCommands:
          Type: Api
          Properties:
            Path: /streetlights/{id}/commands
            Method: get

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "lightwise-ws-${Env}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Env
      AutoDeploy: true

  WebSocketAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.websocket_authorizer.handler

  WebSocketAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketAuthorizerFunction.Arn}/invocations"
      IdentitySource:
        - route.request.header.Sec-WebSocket-Protocol
      Name: CognitoWebSocketAuthorizer

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizer
      Target: !Sub "integrations/${WebSocketConnectIntegration}"

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations"

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketDisconnectIntegration}"

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations"

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: subscribe
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketSubscribeIntegration}"

  WebSocketSubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketSubscribeFunction.Arn}/invocations"

  WebSocketSubscribePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketSubscribeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.websocket_connect.handler

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.websocket_disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnections

  WebSocketSubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.websocket_subscribe.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnections
        - DynamoDBReadPolicy:
            TableName: !Ref UsersAndTenants

  TelemetryIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: infrastructure.handlers.telemetry_ingest.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Streetlights
        - DynamoDBReadPolicy:
            TableName: !Ref StreetlightMetadata
        - DynamoDBReadPolicy:
            TableName: !Ref WebSocketConnections
        - DynamoDBCrudPolicy:
            TableName: !Ref DownlinkCommands
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  Streetlights:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: streetlight_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: streetlight_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StreetlightIndex
          KeySchema:
            - AttributeName: streetlight_id
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - tenant_id

  StreetlightMetadata:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: streetlight_id
          AttributeType: S
        - AttributeName: wireless_device_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: streetlight_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: WirelessDeviceIndex
          KeySchema:
            - AttributeName: wireless_device_id
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - streetlight_id
              - tenant_id
              - site_id

  UsersAndTenants:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE

  WebSocketConnections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: streetlight_id
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
        - AttributeName: streetlight_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: StreetlightIndex
          KeySchema:
            - AttributeName: streetlight_id
              KeyType: HASH
            - AttributeName: tenant_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DownlinkCommands:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: streetlight_id
          AttributeType: S
        - AttributeName: command_id
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: streetlight_id
          KeyType: HASH
        - AttributeName: command_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByTenant
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: command_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  WebSocketEndpoint:
    Description: WebSocket URL for frontend
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
  WebSocketManagementUrl:
    Description: Management URL for post_to_connection
    Value: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
  RestApiEndpoint:
    Description: REST API base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoAppClient
  CognitoHostedUiDomain:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  CognitoLoginUrl:
    Description: Direct login URL for the Hosted UI
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${CognitoAppClient}&response_type=code&scope=email+openid+profile&redirect_uri=${CognitoRedirectUri}"
