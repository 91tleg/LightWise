AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Env:
    Type: String
    Default: local
  DynamoEndpoint:
    Type: String
    Default: ""
  InfluxUrl:
    Type: String
    Default: ""
  InfluxToken:
    Type: String
    Default: ""
    NoEcho: true
  InfluxOrg:
    Type: String
    Default: ""
  AuthEnabled:
    Type: String
    Default: "false"

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,PUT,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt CognitoUserPool.Arn
          Identity:
            Header: Authorization
  Function:
    Runtime: python3.11
    Timeout: 15
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        ENV: !Ref Env
        AUTH_ENABLED: !Ref AuthEnabled
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool
        COGNITO_CLIENT_ID: !Ref CognitoAppClient
        WS_ENDPOINT: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
        WS_MANAGEMENT_URL: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
        DYNAMO_ENDPOINT: !Ref DynamoEndpoint
        DDB_TABLE_STREETLIGHTS: !Ref Streetlights
        DDB_TABLE_STREETLIGHT_METADATA: !Ref StreetlightMetadata
        DDB_TABLE_USERS_AND_TENANTS: !Ref UsersAndTenants
        DDB_TABLE_WS_CONNECTIONS: !Ref WebSocketConnections
        TELEMETRY_BACKEND: influxdb
        INFLUX_URL: !Ref InfluxUrl
        INFLUX_TOKEN: !Ref InfluxToken
        INFLUX_ORG: !Ref InfluxOrg
        INFLUX_BUCKET: streetlight-telemetry

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "lightwise-${Env}"

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailMessage: |
            You have been invited to LightWise.
            Your username is {username} and your temporary password is {####}.
            Please sign in and change your password.
          EmailSubject: "Your LightWise account"

      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

        - Name: given_name
          AttributeDataType: String
          Required: true
          Mutable: true

        - Name: family_name
          AttributeDataType: String
          Required: true
          Mutable: true

        - Name: tenant_id
          AttributeDataType: String
          Required: false
          Mutable: false

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

      MfaConfiguration: "OFF"

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref CognitoUserPool
      Description: "Full access — LightWise team and system administrators"
      Precedence: 0

  CognitoOperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operators
      UserPoolId: !Ref CognitoUserPool
      Description: "Read and control access — municipal operators"
      Precedence: 1

  CognitoAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "lightwise-frontend-${Env}"
      UserPoolId: !Ref CognitoUserPool

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - phone
        - profile

      CallbackURLs:
        - http://localhost:3001/callback

      LogoutURLs:
        - http://localhost:3001/

      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

      ReadAttributes:
        - email
        - given_name
        - family_name
        - custom:tenant_id

      WriteAttributes:
        - email
        - given_name
        - family_name

      PreventUserExistenceErrors: ENABLED

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "lightwise-${Env}-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPool

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "lightwise-ws-${Env}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Env
      AutoDeploy: true

  # Connect
  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketConnectIntegration}"

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations"

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # Disconnect
  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketDisconnectIntegration}"

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations"

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # Subscribe
  WebSocketSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: subscribe
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketSubscribeIntegration}"

  WebSocketSubscribeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketSubscribeFunction.Arn}/invocations"

  WebSocketSubscribePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketSubscribeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  TelemetryIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.telemetry_ingest.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Streetlights
        - DynamoDBReadPolicy:
            TableName: !Ref StreetlightMetadata
        - DynamoDBReadPolicy:
            TableName: !Ref WebSocketConnections
        - Statement:
          - Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.websocket.connect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnections

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.websocket.disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnections

  WebSocketSubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.websocket.subscribe.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketConnections
        - DynamoDBReadPolicy:
            TableName: !Ref UsersAndTenants

  AuthMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.api.auth.handler.handler
      Events:
        AuthMe:
          Type: Api
          Properties:
            Path: /auth/me
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

  ListStreetlightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.api.streetlights.list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Streetlights
        - DynamoDBReadPolicy:
            TableName: !Ref StreetlightMetadata
      Events:
        ListStreetlights:
          Type: Api
          Properties:
            Path: /streetlights
            Method: get

  GetStreetlightFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.api.streetlights.get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Streetlights
        - DynamoDBReadPolicy:
            TableName: !Ref StreetlightMetadata
      Events:
        GetStreetlight:
          Type: Api
          Properties:
            Path: /streetlights/{id}
            Method: get

  GetStreetlightTelemetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.api.streetlights.telemetry.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Streetlights
      Events:
        GetStreetlightTelemetry:
          Type: Api
          Properties:
            Path: /streetlights/{id}/telemetry
            Method: get

  UpdateStreetlightMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services.api.streetlights.update_metadata.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StreetlightMetadata
      Events:
        UpdateStreetlightMetadata:
          Type: Api
          Properties:
            Path: /streetlights/{id}/metadata
            Method: put

  Streetlights:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: streetlight_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: streetlight_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StreetlightIndex
          KeySchema:
            - AttributeName: streetlight_id
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - tenant_id

  StreetlightMetadata:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: streetlight_id
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: wireless_device_id
          AttributeType: S
      KeySchema:
        - AttributeName: streetlight_id
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: WirelessDeviceIndex
          KeySchema:
            - AttributeName: wireless_device_id
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - streetlight_id
              - tenant_id
              - site_id

  UsersAndTenants:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE

  WebSocketConnections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: streetlight_id
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StreetlightIndex
          KeySchema:
            - AttributeName: streetlight_id
              KeyType: HASH
            - AttributeName: tenant_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  WebSocketEndpoint:
    Description: WebSocket URL for frontend
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
  WebSocketManagementUrl:
    Description: Management URL for post_to_connection
    Value: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
  RestApiEndpoint:
    Description: REST API base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoAppClient
  CognitoHostedUiDomain:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
