name: Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      API_STACK_NAME: ${{ secrets.API_STACK_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load API stack outputs
        run: |
          STACK_NAME="${API_STACK_NAME:-lightwise-api}"
          OUTPUTS="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output json)"

          get_output() {
            node -e "const outputs = JSON.parse(process.argv[1]); const key = process.argv[2]; const item = outputs.find((entry) => entry.OutputKey === key); process.stdout.write(item?.OutputValue || '');" "$OUTPUTS" "$1"
          }

          REACT_APP_WS_URL="$(get_output WebSocketEndpoint)"
          REACT_APP_API_BASE="$(get_output RestApiEndpoint)"
          REACT_APP_COGNITO_DOMAIN="$(get_output CognitoHostedUiDomain)"
          REACT_APP_COGNITO_CLIENT_ID="$(get_output CognitoClientId)"
          REACT_APP_COGNITO_REDIRECT_URI="$(get_output CognitoRedirectUri)"
          REACT_APP_COGNITO_LOGOUT_URI="$(get_output CognitoLogoutUri)"

          for name in \
            REACT_APP_API_BASE \
            REACT_APP_COGNITO_DOMAIN \
            REACT_APP_COGNITO_CLIENT_ID \
            REACT_APP_COGNITO_REDIRECT_URI \
            REACT_APP_COGNITO_LOGOUT_URI
          do
            if [ -z "${!name}" ]; then
              echo "Missing required CloudFormation output for $name"
              exit 1
            fi
          done

          {
            echo "REACT_APP_USE_MOCK=false"
            echo "REACT_APP_WS_URL=$REACT_APP_WS_URL"
            echo "REACT_APP_API_BASE=$REACT_APP_API_BASE"
            echo "REACT_APP_COGNITO_DOMAIN=$REACT_APP_COGNITO_DOMAIN"
            echo "REACT_APP_COGNITO_CLIENT_ID=$REACT_APP_COGNITO_CLIENT_ID"
            echo "REACT_APP_COGNITO_REDIRECT_URI=$REACT_APP_COGNITO_REDIRECT_URI"
            echo "REACT_APP_COGNITO_LOGOUT_URI=$REACT_APP_COGNITO_LOGOUT_URI"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build project
        run: npm run build

      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - name: Upload hashed static assets
        run: |
          aws s3 sync build s3://${{ secrets.WEB_DEPLOY_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "404.html" \
            --exclude "asset-manifest.json"

      - name: Upload app shell
        run: |
          aws s3 cp build/index.html s3://${{ secrets.WEB_DEPLOY_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws s3 cp build/404.html s3://${{ secrets.WEB_DEPLOY_BUCKET }}/404.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws s3 cp build/asset-manifest.json s3://${{ secrets.WEB_DEPLOY_BUCKET }}/asset-manifest.json \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
