name: Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      REACT_APP_WS_URL: ${{ secrets.REACT_APP_WS_URL }}
      REACT_APP_API_BASE: ${{ secrets.REACT_APP_API_BASE }}
      REACT_APP_COGNITO_USER_POOL_ID: ${{ secrets.REACT_APP_COGNITO_USER_POOL_ID }}
      REACT_APP_COGNITO_DOMAIN: ${{ secrets.REACT_APP_COGNITO_DOMAIN }}
      REACT_APP_COGNITO_CLIENT_ID: ${{ secrets.REACT_APP_COGNITO_CLIENT_ID }}
      REACT_APP_COGNITO_REDIRECT_URI: ${{ secrets.REACT_APP_COGNITO_REDIRECT_URI }}
      REACT_APP_COGNITO_LOGOUT_URI: ${{ secrets.REACT_APP_COGNITO_LOGOUT_URI }}
      REACT_APP_COGNITO_SCOPES: ${{ secrets.REACT_APP_COGNITO_SCOPES }}
      REACT_APP_USE_MOCK: ${{ secrets.REACT_APP_USE_MOCK }}
      REACT_APP_TENANT_ID: ${{ secrets.REACT_APP_TENANT_ID }}
      REACT_APP_DEFAULT_STREETLIGHT_ID: ${{ secrets.REACT_APP_DEFAULT_STREETLIGHT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build project
        run: npm run build

      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed static assets
        run: |
          aws s3 sync build s3://${{ secrets.WEB_S3_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "404.html" \
            --exclude "asset-manifest.json"

      - name: Upload app shell
        run: |
          aws s3 cp build/index.html s3://${{ secrets.WEB_S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws s3 cp build/404.html s3://${{ secrets.WEB_S3_BUCKET }}/404.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws s3 cp build/asset-manifest.json s3://${{ secrets.WEB_S3_BUCKET }}/asset-manifest.json \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
