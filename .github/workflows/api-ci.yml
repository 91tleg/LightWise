name: API CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest

      - name: Start local DynamoDB
        run: |
          docker compose -f docker/dynamodb/docker-compose.yml up -d

      - name: Wait for local DynamoDB
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "DynamoDB is ready"
              exit 0
            fi
            echo "Waiting for DynamoDB..."
            sleep 2
          done
          echo "DynamoDB did not become ready in time"
          docker compose -f docker/dynamodb/docker-compose.yml logs
          exit 1

      - name: Lint code
        run: |
          flake8 src/ tests/

      #- name: Type check
      #  run: |
      #    mypy src/ tests/

      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-west-2
          AWS_REGION: us-west-2
          DYNAMO_ENDPOINT: http://localhost:8000
        run: |
          pytest tests/ --maxfail=1 --disable-warnings -q

      - name: Stop local DynamoDB
        if: always()
        run: |
          docker compose -f docker/dynamodb/docker-compose.yml down
