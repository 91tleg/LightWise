name: API CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest
      - name: Lint code
        run: flake8 src/ tests/
      - name: Run unit tests
        run: pytest tests/unit --maxfail=1 --disable-warnings -q

  integration:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: apps/api
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Start local DynamoDB
        run: docker compose -f docker/dynamodb/docker-compose.yml up -d
      - name: Wait for DynamoDB and table
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "DynamoDB is ready"
              break
            fi
            echo "Waiting for DynamoDB..."
            sleep 2
          done
          echo "Waiting for setup container to finish..."
          docker compose -f docker/dynamodb/docker-compose.yml wait dynamodb-setup || true
          echo "Verifying table exists..."
          for i in {1..10}; do
            if aws dynamodb describe-table \
                --table-name DownlinkCommands \
                --endpoint-url http://localhost:8000 \
                --region us-west-2 2>/dev/null; then
              echo "Table is ready"
              exit 0
            fi
            echo "Waiting for table..."
            sleep 2
          done
          echo "Table did not become ready in time"
          exit 1
      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-west-2
          DYNAMO_ENDPOINT: http://localhost:8000
        run: pytest tests/integration --maxfail=1 --disable-warnings -q
      - name: Stop local DynamoDB
        if: always()
        run: docker compose -f docker/dynamodb/docker-compose.yml down
